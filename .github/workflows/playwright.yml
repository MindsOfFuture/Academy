name: Playwright Tests
permissions:
  contents: read
on:
  # development também: teste que só roda na main acusa a falha quando já está no ar.
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]
# Banco e contas de teste são os mesmos para todas as execuções: duas ao mesmo tempo
# (push na development e merge na main) derrubavam o login uma da outra no logout.
concurrency:
  group: e2e-banco-compartilhado
  cancel-in-progress: false
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # Navegadores e dependências já vêm na imagem oficial: o "playwright install --with-deps"
    # falhava no Ubuntu 26.04 e travava no 24.04 (nov/2026). A tag acompanha o @playwright/test
    # do package-lock; ao subir um, suba o outro (o passo "Conferir versão" acusa a diferença).
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      # Root (sem --user) para instalar o LibreOffice do relatório em PDF.
    # No container o shell padrão é sh; o passo de segredos usa ${!v}, que é bash.
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4
    # Sem estes segredos o middleware responde 503 e o servidor de teste nunca fica pronto
    # (era o "Timed out waiting 120000ms from config.webServer" de toda execução até 10/10).
    - name: Conferir segredos do E2E
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        TEST_STUDENT_EMAIL: ${{ secrets.TEST_STUDENT_EMAIL }}
        TEST_STUDENT_PASSWORD: ${{ secrets.TEST_STUDENT_PASSWORD }}
        TEST_GESTAO_COORD_EMAIL: ${{ secrets.TEST_GESTAO_COORD_EMAIL }}
        TEST_GESTAO_COORD_PASSWORD: ${{ secrets.TEST_GESTAO_COORD_PASSWORD }}
        TEST_TEACHER_EMAIL: ${{ secrets.TEST_TEACHER_EMAIL }}
        TEST_TEACHER_PASSWORD: ${{ secrets.TEST_TEACHER_PASSWORD }}
        TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
        TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
      run: |
        faltam=""
        for v in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY TEST_STUDENT_EMAIL TEST_STUDENT_PASSWORD TEST_GESTAO_COORD_EMAIL TEST_GESTAO_COORD_PASSWORD TEST_TEACHER_EMAIL TEST_TEACHER_PASSWORD TEST_ADMIN_EMAIL TEST_ADMIN_PASSWORD; do
          [ -n "${!v}" ] || faltam="$faltam $v"
        done
        if [ -n "$faltam" ]; then
          echo "::error::Segredos ausentes:$faltam. Cadastre em Settings > Secrets and variables > Actions (valores em e2e/README.md e .env.example)."
          exit 1
        fi
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: LibreOffice para o relatório em PDF (como no servidor)
      run: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libreoffice-writer-nogui fonts-crosextra-carlito >/dev/null
    - name: Conferir versão do Playwright contra a imagem
      run: |
        v=$(node -p "require('@playwright/test/package.json').version")
        [ "$v" = "1.57.0" ] || { echo "::error::@playwright/test $v instalado, imagem é v1.57.0. Atualize container.image."; exit 1; }
    - name: Run Playwright tests
      run: npx playwright test
      env:
        # Como root o Firefox recusa um HOME de outro dono; o GitHub força HOME=/github/home
        # no container, então o passo sobrescreve.
        HOME: /root
        # Sem estas o middleware responde 503 e todo spec autenticado quebra ou pula.
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        GESTAO_ENABLED: "true"
        TEST_STUDENT_EMAIL: ${{ secrets.TEST_STUDENT_EMAIL }}
        TEST_STUDENT_PASSWORD: ${{ secrets.TEST_STUDENT_PASSWORD }}
        TEST_GESTAO_COORD_EMAIL: ${{ secrets.TEST_GESTAO_COORD_EMAIL }}
        TEST_GESTAO_COORD_PASSWORD: ${{ secrets.TEST_GESTAO_COORD_PASSWORD }}
        TEST_TEACHER_EMAIL: ${{ secrets.TEST_TEACHER_EMAIL }}
        TEST_TEACHER_PASSWORD: ${{ secrets.TEST_TEACHER_PASSWORD }}
        TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
        TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
        # Sem RESEND_API_KEY de propósito: aviso de alocação dos bolsistas de teste não sai.
    # ADR 012: spec fora do diretório certo não roda e o CI fica verde. Prova que rodou e passou.
    - name: Conferir que o E2E da alocação rodou
      if: ${{ !cancelled() }}
      run: |
        node -e "
          const r = require('./test-results/results.json'); const t = [];
          const walk = (s) => { (s.suites || []).forEach(walk); for (const sp of s.specs || []) if (sp.file.includes('gestao-alocacao')) t.push(...sp.tests); };
          r.suites.forEach(walk);
          const ok = t.filter((x) => x.status === 'expected').length;
          console.log('gestao-alocacao: ' + t.length + ' testes, ' + ok + ' passaram');
          if (!t.length || ok !== t.length) process.exit(1);
        "
    # Sem artefato de propósito (spec 017): o repositório é público e qualquer
    # conta do GitHub baixa artefatos. O resultado fica no log do reporter "list".
